<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechConnect | Developer Community Hub</title>
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <!-- Custom CSS layered on top of Bootstrap -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-light">

  <!-- Semantic Header -->
  <header class="bg-dark text-white py-4 mb-4 shadow-sm">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-md-center">
      <div>
        <h1 class="h3 mb-1 fw-bold">TechConnect Hub</h1>
        <p class="mb-0 text-secondary">Internal Developer Community Directory</p>
      </div>
      <!-- Live Counter Badge -->
      <div class="mt-3 mt-md-0">
        <span class="badge bg-primary fs-6 px-3 py-2">
          Showing <span id="devCount">0</span> Developers
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container pb-5">
    
    <!-- Controls Section: Search & View Toggle -->
    <section aria-label="Directory Controls" class="card border-0 shadow-sm p-3 mb-4">
      <div class="row g-3 align-items-center">
        <div class="col-md-8">
          <label for="searchInput" class="visually-hidden">Search developers</label>
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Search by name, role, or skill (e.g. React, Frontend, Python)..."
          />
        </div>
        <div class="col-md-4 text-md-end">
          <button id="viewToggleBtn" class="btn btn-outline-dark w-100 w-md-auto" type="button">
            Switch to Table View
          </button>
        </div>
      </div>
    </section>

    <div class="row g-4">
      <!-- Left Column: Add Developer Form -->
      <aside class="col-lg-4">
        <section aria-labelledby="formHeading" class="card border-0 shadow-sm p-4">
          <h2 id="formHeading" class="h5 fw-bold mb-3">Add New Developer</h2>
          <form id="addDevForm" novalidate>
            <div class="mb-3">
              <label for="devName" class="form-label">Full Name *</label>
              <input type="text" id="devName" class="form-control" required />
              <div class="invalid-feedback">Please enter the developer's full name.</div>
            </div>

            <div class="mb-3">
              <label for="devRole" class="form-label">Role *</label>
              <input type="text" id="devRole" class="form-control" placeholder="e.g. Frontend Developer" required />
              <div class="invalid-feedback">Please enter a valid role.</div>
            </div>

            <div class="mb-3">
              <label for="devLocation" class="form-label">Location *</label>
              <input type="text" id="devLocation" class="form-control" placeholder="e.g. Cape Town, South Africa" required />
              <div class="invalid-feedback">Please enter a city or country.</div>
            </div>

            <div class="mb-3">
              <label for="devSkills" class="form-label">Skills (comma-separated) *</label>
              <input type="text" id="devSkills" class="form-control" placeholder="e.g. HTML, CSS, JavaScript" required />
              <div class="invalid-feedback">Enter at least one skill separated by commas.</div>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="devAvailable" checked />
              <label class="form-check-label" for="devAvailable">
                Available for Hire
              </label>
            </div>

            <button type="submit" class="btn btn-primary w-100">Add to Directory</button>
          </form>
        </section>
      </aside>

      <!-- Right Column: Directory Display Area -->
      <section aria-label="Developer Directory" class="col-lg-8">
        <!-- Card Grid View Container -->
        <div id="cardViewContainer" class="row g-3"></div>

        <!-- Table List View Container (Hidden by default) -->
        <div id="tableViewContainer" class="table-responsive bg-white rounded shadow-sm p-3 d-none">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>Name</th>
                <th>Role</th>
                <th>Skills</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </div>

  </main>

  <!-- Bootstrap JS Bundle & Custom Script -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
